apiVersion: apps/v1
kind: Deployment
metadata:
  name: blogapp-deployment
spec:
  selector:
    matchLabels:
      app: blogapp
  replicas: 2
  template:
    metadata:
      labels:
        app: blogapp
    spec:
      containers:
        - name: blogapp
          image: mskr7/blogapp:latest # Updated image to private DockerHub image
          resources:
            limits:
              memory: 300Mi
              cpu: "1"
            requests:
              memory: 200Mi
              cpu: "0.2"
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
      imagePullSecrets:
        - name: regcred # Reference to the Docker registry secret
---
apiVersion: v1
kind: Service
metadata:
  name: blogapp-ssvc
spec:
  selector:
    app: blogapp
  ports:
    - protocol: "TCP"
      port: 80
      targetPort: 8080
  type: LoadBalancer
